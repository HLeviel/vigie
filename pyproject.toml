[project]
name = "vigie"
version = "0.0.0"
description = "Copilote IA de recherche d'emploi pour le marché français"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.5",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "PyYAML>=6.0",
    "jinja2>=3.1",
    "boto3>=1.35",
    "beautifulsoup4>=4.15.0",
    "tzdata>=2026.6",
]

[project.scripts]
vigie = "vigie.radar.cli:root"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "types-PyYAML",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigie"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
files = ["src/vigie"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=src/vigie --cov-report=term-missing"
