name: radar

# Modèle du workflow d'exécution, à copier dans le dépôt PRIVÉ `vigie-run`. Il ne contient aucun code
# Python : il installe une version TAGUÉE de Vigie (dépôt public) puis l'exécute. Étapes de mise en
# place : README.md de ce dossier.
on:
  schedule:
    - cron: "17 5 * * *"   # tous les jours à 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Une seule exécution à la fois : l'état S3 est lu puis réécrit.
concurrency:
  group: radar
  cancel-in-progress: false

env:
  # Version de Vigie : un tag du dépôt public, jamais `main`. Pour mettre à jour, changer cette ligne.
  VIGIE_REF: v0.1.0

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Les secrets vivent dans l'environnement « radar » (limité à la branche main), pas en secrets de dépôt.
    environment: radar
    steps:
      # 1. vigie-run : config/radar.yaml et cv/
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      # 2. Vigie, à la version épinglée
      - name: Installer Vigie à la version épinglée
        run: uv tool install "git+https://github.com/HLeviel/vigie@${VIGIE_REF}"
      - name: Ajouter les outils uv au PATH
        run: echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
      # 3. Aucune clé AWS stockée : jeton OIDC échangé contre un rôle limité au bucket d'état.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      # Les secrets ne sont exposés qu'aux deux étapes qui en ont besoin (jamais au job entier, donc
      # jamais aux actions tierces ci-dessus).
      # 4. Configuration et secrets
      - name: Vérifier la configuration et les secrets
        run: vigie radar check --config config/radar.yaml --ci
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          IMAP_FOLDER: ${{ secrets.IMAP_FOLDER }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          VIGIE_STATE_BUCKET: ${{ secrets.VIGIE_STATE_BUCKET }}
      # 5 à 7. `run` télécharge l'état depuis S3 au début, collecte, envoie le digest, puis renvoie
      # l'état (VIGIE_STATE_BUCKET) : l'envoi dépend de l'issue de l'exécution.
      - name: Collecter, envoyer le digest et synchroniser l'état
        run: vigie radar run --config config/radar.yaml
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          IMAP_FOLDER: ${{ secrets.IMAP_FOLDER }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          VIGIE_STATE_BUCKET: ${{ secrets.VIGIE_STATE_BUCKET }}
