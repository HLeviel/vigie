# Configuration FICTIVE, commitée. La vraie configuration (critères, entreprises ciblées) vit dans le
# dépôt PRIVÉ `vigie-run` (config/radar.yaml), passée par `--config`. En local, copier ce fichier vers
# config/radar.yaml (ignoré par git). Ne jamais committer de critères ni d'entreprises réels ici.

sources:
  adzuna: { enabled: true }
  ats: { enabled: true }              # greenhouse, lever, ashby, smartrecruiters, recruitee
  email_alerts: { enabled: true }     # exige IMAP_HOST, IMAP_USER, IMAP_PASSWORD, IMAP_FOLDER ; sinon mettre false
  france_travail: { enabled: false }  # en attente d'accès

ats_companies:                         # entreprises FICTIVES ; `token` = identifiant de la page carrières
  - { name: "Exemple IA", platform: greenhouse, token: "exempleia" }
  - { name: "Startup Data", platform: lever, token: "startupdata" }

email_alerts:
  allowed_senders:                     # à vérifier sur de vrais emails
    france_travail: ["@francetravail.fr"]
    apec: ["@apec.fr"]
    wttj: ["@welcometothejungle.com"]
    linkedin: ["@linkedin.com"]

searches:
  - name: data-ai-lyon
    keywords: ["data engineer", "machine learning", "IA"]
    departments: ["69"]
    contract_types: [CDI, FREELANCE]
    max_age_days: 7

filters:
  exclude_title: ["stage", "alternance", "commercial"]
  exclude_companies: []
  require_any: ["python", "data", "ia", "machine learning"]   # sur titre + description

digest:
  max_items: 50
  format: html          # html ou markdown

# Scoring des offres (module match, étape 1 : profil et vérification seulement).
# Décommenter après avoir créé profile/profile.yaml (modèle : config/profile.example.yaml).
# Aucun modèle d'embedding par défaut : à choisir (l'évaluation du lot M2 en fixera un).
# match:
#   enabled: true
#   profile: profile/profile.yaml
#   embeddings:
#     provider: local            # local ou bedrock
#     model: "<id du modèle>"
#   weights: { semantic: 0.7, lexical: 0.3 }
#   penalties: { remote: 15, salary: 15, avoid: 20 }
#   top_k_profile: 3
#   llm:                         # étage LLM (OpenRouter), désactivé par défaut ; modèle libre
#     enabled: false
#     model: "<fournisseur>/<modèle>"
#     temperature: 0
#     max_tokens: 800            # par appel
#     top_n: 10
#     max_calls_per_run: 15
#     max_total_tokens_per_run: 60000
#   digest: { min_score: 40 }
#   evaluation:                  # `vigie match eval` : modèles comparés (2 à 3), en plus de `embeddings`
#     candidates:
#       - { provider: bedrock, model: "<id d'un autre modèle>" }
#     llm_models: ["<fournisseur-a>/<modèle-a>", "<fournisseur-b>/<modèle-b>"]   # hybrid+llm
